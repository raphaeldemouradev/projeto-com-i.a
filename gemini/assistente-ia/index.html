<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alexandre - Assistente Pessoal</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="chat-card">
        <header class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <strong>Alexandre AI</strong>
            </div>
            
            <button id="btn-mute" title="Ativar/Desativar som">
                <i class="fas fa-volume-up"></i>
            </button>
        </header>
        
        <main id="chat-window">
            <div class="message ai-msg">Olá! Sou o Alexandre. Como posso te ajudar?</div>
        </main>

        <footer class="input-area">
            <button id="btn-voz" class="btn-icon" title="Falar">
                <i class="fas fa-microphone"></i>
            </button>
            
            <input type="text" id="user-input" placeholder="Digite ou fale..." autocomplete="off">
            
            <button id="btn-enviar" class="btn-icon" title="Enviar">
                <i class="fas fa-paper-plane"></i>
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="wiki.js"></script>
    <script src="database.js"></script>
</body>
</html>
