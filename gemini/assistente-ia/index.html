<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Pessoal - Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="chat-card">
    <div class="chat-header">
        <div class="status-dot"></div>
        <strong>Assistente Inteligente</strong>
    </div>
    
    <div id="chat-window">
        <div class="message ai-msg">Olá! Como posso te ajudar hoje?</div>
    </div>

    <div class="input-area">
        <button id="btn-voz" class="btn-secondary">
            <i class="fas fa-microphone"></i>
        </button>
        <input type="text" id="user-input" placeholder="Digite ou fale...">
        <button id="btn-enviar" class="btn-primary">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script src="script.js"></script>
<script src="database.js"></script>
</body>
</html>
